<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Màn lệch</title>
<style>
  body { margin: 0; font-family: Roboto, Arial, sans-serif; font-size: 14px; color: rgb(33, 33, 33); }
  .khung { padding: 16px 24px; display: flex; flex-direction: column; row-gap: 16px; }
  h2 { margin: 0 0 8px 0; font-size: 20px; }
  .dong { display: flex; column-gap: 8px; align-items: center; }
  label { width: 160px; font-size: 14px; }
  input, select { height: 32px; box-sizing: border-box; padding: 4px 8px; font-size: 14px; font-family: Roboto, Arial, sans-serif; border-radius: 4px; border: 1px solid #ccc; }
  button { height: 32px; padding: 0 16px; font-size: 14px; font-family: Roboto, Arial, sans-serif; border-radius: 4px; border: 0; }
  /* LỖI CÀI SẴN — mỗi dòng nhắm một trục */
  #luu { height: 30px; padding: 0 14px; }          /* nút lệch chiều cao + padding khác đa số  */
  .lech-kc { margin-top: 13px; }                     /* khoảng cách lẻ thang                     */
  #ghiChu { font-family: "Comic Sans MS", cursive; } /* nhãn lệch font                           */
  .riTextBox { font-family: "Helvetica Neue", Arial; padding: 2px 5px 1px 5px; } /* ô chữ của thư viện khác trên cùng form */
  textarea { height: 64px; box-sizing: border-box; padding: 4px 8px; font-size: 14px; font-family: Roboto, Arial, sans-serif; border-radius: 4px; border: 1px solid #ccc; }
</style></head><body>
<div class="khung">
  <h2>Hồ sơ lớp</h2>
  <div class="dong lech-kc"><label for="d">Tên lớp</label><input id="d" type="text" value="6A"></div>
  <div class="dong"><label id="ghiChu" for="e">Ghi chú</label><input id="e" type="text" value=""></div>
  <div class="dong"><label for="g">Kinh tuyến</label><input id="g" class="riTextBox" type="text" value=""></div>
  <div class="dong"><label for="h">Địa chỉ</label><textarea id="h"></textarea></div>
  <div class="dong"><button id="luu">Lưu</button><button id="dong">Đóng</button></div>
</div></body></html>
