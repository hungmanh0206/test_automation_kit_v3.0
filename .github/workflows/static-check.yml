# Static / quality check — chạy MỖI push & PR. KHÔNG cần secret, KHÔNG hit UAT.
# Bắt vỡ tooling của kit (script/JSON/schema) — đây là CI có giá trị thật ngay cả khi
# chưa có spec committed (kit là AI-agent-driven; regression thật để ci.yml nightly/manual).
name: static-check

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    # ĐO CẢ HAI ĐẦU CỦA `engines` (09/11/2026).
    #
    # Trước: CI chỉ chạy 22, máy chủ dự án chạy 26 ⇒ KHÔNG AI ĐO BẢN ĐANG ĐƯỢC DÙNG. `engines` khai
    # ">=22" nên 26 nằm trong lời hứa mà không nằm trong phép đo.
    #
    # Vì sao KHÔNG bỏ 22 để chuyển hẳn sang 26: lỗi `node --test <thư mục>` ngày 09/11 XANH trên 26
    # và ĐỎ trên 22 — chính lượt CI chạy 22 là thứ bắt được nó. Bỏ sàn đi là bỏ luôn phép đo đã cứu
    # mình, và luật ② của `lint:env` mất căn cứ tồn tại.
    #
    # Vì sao chỉ ma trận ở ĐÂY: `heavy-gates` và `task-execute` phần lớn không phụ thuộc bản Node, và
    # chúng vốn đã lâu. Nhân đôi chúng là trả giá mà không mua thêm thông tin.
    strategy:
      fail-fast: false   # một bản đỏ không được che mất kết quả của bản kia
      matrix:
        node: [22, 26]
    name: static (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Preflight (G1 — config/context integrity, miss-file/PARSE_FAILURE = đỏ)
        run: npm run preflight

      - name: Syntax check (node --check toàn bộ script committed)
        run: |
          set -e
          find scripts -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          find scripts -name '*.mjs' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
          echo "node --check OK"

      - name: JSON validity (mọi .json đang được track — danh sách viết tay đã từng đỏ oan)
        run: npm run json:check

      - name: Dependency có nơi dùng hoặc có lý do (dep dạng URL phải khai, lockfile phải có integrity)
        run: npm run deps:check

      - name: Rút gọn core_rules không được làm mất luật (mọi luật phải có con trỏ giải được)
        run: npm run rule:parity:enforce

      - name: Phạm vi CI (spec theo task không được track · nightly không chạm UAT)
        run: npm run ci:scope

      - name: Policy 1-nguồn (F3 — RULE_GLOBAL canonical, core_rules là digest có pointer)
        run: npm run gate:policy

      # Bảng số đo QUICKSTART là số DẪN XUẤT nhưng từng giữ bằng tay — nó trôi BA lần trong một đợt
      # phát hành (919→920→928→929), lần nào cũng chỉ lộ ra sau 10 phút chạy cả bộ. Nay có máy sinh.
      # Extension Kit A: ba cửa NHANH và tất định. `extension:baseline` CỐ Ý không ở đây — nó so với
      # một ảnh chụp đông cứng, nên mọi thay đổi lõi CHÍNH ĐÁNG cũng làm nó đỏ; vai trò đó đã có
      # `version:check`. Chạy nó lúc nhập extension và lúc nghi ngờ.
      - name: Extension Kit A — cấu trúc, định tuyến, unit test
        run: npm run extension:check
      - name: Extension Kit A — benchmark định tuyến tất định
        run: npm run extension:benchmark
      - name: Extension Kit A — unit test (node --test)
        run: npm run extension:test

      # Khẳng định XANH ở nơi nó chạy và ĐỎ ở nơi nó không chạy — 4 sự cố trong 1 phiên (09/11/2026).
      # Đo ngược lại lịch sử: 3/3 sự cố tái dựng từ git ĐỀU bị bắt, đúng dòng, đúng lý do.
      - name: Khẳng định phụ thuộc môi trường (lint:env)
        run: npm run lint:env

      - name: Bảng số đo QUICKSTART khớp cây thật
        run: npm run quickstart:numbers:check

      - name: Danh mục gate khớp source (bảng lệch = một gate đã đổi mức CHẶN/CẢNH BÁO mà không ai ghi)
        run: npm run gates:index:check

      # Mã gate KHÔNG do gate gọi tên — `maCua()` khớp regex lên câu thông báo. Nên nới một `khop` có thể
      # giành mất câu của mã khác, và người sửa đọc hướng dẫn của mã sai. Đo 12/10/2026: 18/7939 chuỗi
      # khớp hai mã hoặc hơn, trong đó có cặp hai mã T0.
      - name: Cặp bẩn/sạch và đường định tuyến của 21 mã T0/T1 (gate:code-pair --enforce)
        run: npm run gate:code-pair:enforce

      # CHUẨN HÀNH VĂN của tài liệu kit, nối vào CI ngày 30/10/2026.
      #
      # Vì sao nối vào ĐÂY mà không vào `predeploy`: `predeploy` chỉ chạy ở cửa phát hành, nên văn trôi
      # giữa hai đợt sẽ sống nguyên tới lúc đó. Văn trôi theo từng lần sửa tài liệu, nên phải bắt theo
      # từng push.
      #
      # Vì sao trước đây nó KHÔNG được nối: không lý do nào, và đó mới là vấn đề. Cửa có từ lâu, có mốc
      # suy ra từ MAX của 34 bài người viết tay, nhưng không bó nào gọi nó — nên 6 file đã trôi khỏi mốc
      # mà CI vẫn xanh. Trong đó `24_time.md` có câu trung bình 25,6 từ so với mốc 16, và một file tôi
      # tự làm trôi ở v2.9.5.
      #
      # Mốc KHÔNG được nới để qua cửa: `--baseline-write` chỉ dùng SAU khi đã viết lại thật. Sáu file nói
      # trên đã dọn bằng cách tách câu, tách danh sách thành gạch đầu dòng, và bỏ viết tắt gạch chéo —
      # không chạm một mốc nào.
      - name: Chuẩn hành văn tài liệu kit (writing:lint:docs — mốc suy từ 34 bài viết tay)
        run: npm run writing:lint:docs

      - name: Bản đồ luật → gate → spec khớp nguồn, và không mục luật nào chưa ai rà
        run: npm run rule:coverage:check

      # Hợp đồng dữ liệu testcase (`scripts/lib/testcase/testcase.d.ts`) phải khớp model. Trước v2.7.0
      # KHÔNG dòng nào trong scripts/**.js được kiểm kiểu, nên hợp đồng đã trôi mất 4 trường.
      - name: Hợp đồng dữ liệu testcase được kiểm bằng kiểu (typecheck:scripts)
        run: npm run typecheck:scripts

      # Parser canonical là chỗ 30 gate cùng dùng. Mốc đóng băng đầu ra trên bộ fixture vàng, cộng hai
      # phép đếm độc lập (model vs đếm thô) — lệch nhau là NGHI GATE SAI, không phải "đạt".
      - name: Bộ dữ liệu vàng của parser canonical (golden:check)
        run: npm run golden:check

      # §Cleanup Rules là mục luật DUY NHẤT mà `rule:coverage` xếp loại "đo được mà chưa có máy". Dump
      # swagger/API sót ở root thường chứa email/SĐT trong giá trị mẫu — một lần `git add .` là lộ PII.
      - name: Dump ad-hoc không còn ở root repo (cleanup:check --enforce)
        run: npm run cleanup:check:enforce

      # Ngân sách token cho hướng dẫn của chính kit. Ngưỡng ở .agent/config/prompt_budget.json, đo theo
      # lời khai bat_buoc trong load_map.json. Chốt chống trôi: tài liệu phình lại bằng cách mỗi lần
      # thêm vài dòng hợp lý, và không gì ghi lại việc đó.
      - name: Ngân sách token hướng dẫn (prompt:budget --enforce)
        run: npm run prompt:budget -- --enforce

      - name: INDEX.md khớp nguồn SKILL.md (artifact sinh trôi khỏi nguồn = không ai thấy)
        run: npm run skills:index:check

      # Chất lượng MÔ TẢ skill — bật `--enforce` ngày 28/10/2026 (v2.9.5 §1.2), sau khi nợ về 0/0/0.
      #
      # Trước đó ba tiêu chí ("dùng khi" · "KHÔNG dùng khi" · nhắc máy kiểm) ở mức cảnh báo kèm sổ nợ,
      # vì chặn ngay lúc 17/16/13 skill còn thiếu sẽ làm đỏ gần hết rồi gate bị tắt. Nợ đã sạch nên
      # chặn được, và chặn ở đây mới giữ được: skill KHÔNG auto-load, nên `description` là thứ DUY NHẤT
      # agent đọc để quyết định có mở hay không. Mô tả không nói được "dùng khi nào" thì skill thành
      # file chết, và đó là kiểu hỏng im lặng nhất của kit — không gate nào đỏ, chỉ là công sức không
      # bao giờ sinh lợi.
      - name: Mô tả skill đủ thông tin để CHỌN (skills:lint:enforce)
        run: npm run skills:lint:enforce

      # Hai skill mô tả gần nhau thì agent không có căn cứ để chọn — `skills:lint` bắt được mô tả TRÙNG,
      # nhưng không bắt được mô tả KHÁC NHAU mà vẫn không tách được việc. Cửa này đo chuyện đó trên 63
      # câu yêu cầu tiếng Việt.
      #
      # ĐỌC ĐÚNG CON SỐ: đây là phép đo ĐẠI DIỆN trên từ ngữ, không mô phỏng cách model chọn. "98%" nghĩa
      # là *phần chữ hiện có đủ phân biệt 98% số ca trong fixture*, KHÔNG phải "agent chọn đúng 98%".
      - name: Mô tả skill tách được việc (skills:route:check)
        run: npm run skills:route:check

      # Link trong skill phải trỏ file CÓ THẬT. Cửa này phân biệt link thật với đường dẫn minh hoạ —
      # xem khối chú thích đầu `skills_refcheck.js`: đếm ngây thơ sinh ra dương tính giả, rồi người ta
      # gỡ ví dụ trong tài liệu đi cho hết đỏ.
      - name: Link nội bộ của skill không gãy (skills:refcheck)
        run: npm run skills:refcheck

      # Luật đổi lời thì tài liệu cũ KHÔNG tự đổi theo — nó ở lại và mâu thuẫn với luật mới, im lặng.
      # Lớp hỏng này đã cắn 3 lần (luật evidence, `/check`, câu chữ step ở P2). Cửa đọc mệnh đề canonical
      # trong `.agent/config/rule_consistency.json` rồi quét mọi file được track tìm câu nói ngược.
      # Miễn trừ phải khai kèm `ly_do` ≥ 20 ký tự, và miễn trừ CHẾT (trỏ vào chỗ không còn mâu thuẫn) bị
      # báo ra — không thì danh sách miễn trừ tự phình lên và cửa thành cửa giả.
      - name: Tài liệu không nói ngược luật canonical (rule:consistency)
        run: npm run rule:consistency

      # Thêm một lệnh `/` hoặc một workflow mà không thêm dòng vào bảng định tuyến thì nó tồn tại mà
      # không ai biết khi nào nên dùng — và quan trọng hơn, khi nào KHÔNG nên. Cửa đọc mẫu số từ ĐĨA,
      # nên điểm vào mới là tự có mặt trong phép đo.
      #
      # Nó cũng chặn ô "KHÔNG dùng khi" để trống: đó là cột duy nhất ba bản liệt kê lệnh đã có
      # (CHEATSHEET / kit-map / skills INDEX) KHÔNG có, tức là cả lý do bảng này tồn tại.
      - name: Bảng định tuyến phủ mọi điểm vào (router:check)
        run: npm run router:check

      # Đổi tên một workflow mà quên chỗ trỏ tới nó: lệnh vẫn "chạy" nhưng đọc hư không.
      # Một máy có spec xanh mà không lệnh/workflow/CI nào gọi thì nó không gác gì.
      # Mức BÁO CÁO: cửa in số và thoát 0; bản :enforce mới chặn.
      - name: Máy nào KHÔNG nằm trên đường chạy nào (gate:reachable)
        run: npm run gate:reachable

      - name: Đường dẫn workflow/template được trỏ tới đều TỒN TẠI (workflow:refs)
        run: npm run workflow:refs

      # Bảng nghiệm thu là lớp DẪN XUẤT viết tay, và mọi bảng viết tay trong kit đều đã trôi ít nhất một
      # lần. Bảng nghiệm thu trôi thì tệ hơn bảng thường: nó là thứ người ta đọc để tin đợt làm đã xong.
      # Cửa chặn dòng để trống, chặn tên máy bịa, và chặn cả khối "CHƯA CÓ MÁY" rỗng — một đợt làm không
      # còn chỗ nào thiếu máy là lời khai đáng ngờ hơn đáng mừng.
      - name: Bảng nghiệm thu A_PARITY không có dòng treo (parity:check)
        run: npm run parity:check

      # Recon sinh ra bản kê màn/API, rồi bản kê đó được dùng làm NGUỒN để viết case. Một endpoint mình
      # tự gọi bằng `fetch` trả 200 không nói gì về việc UI có gọi nó — nhưng nó TRÔNG như một phát hiện.
      # Cửa chặn 7 kiểu tự-gửi-request, và chặn CẢ CHIỀU NGƯỢC: xoá sạch `page.on('response')` thì recon
      # không quan sát gì nữa, mà phép kiểm thứ nhất vẫn xanh. Chỉ đọc file trong repo nên chạy được ở CI.
      - name: Recon chỉ quan sát, không dò (recon:passive)
        run: npm run recon:passive

      # Trang docs/library/ và tài liệu hướng dẫn là lớp DẪN XUẤT: viết tay, nguồn thì đổi liên tục.
      # Trước đây gate này chỉ chạy khi có người NHỚ gõ lệnh — tức là nó chưa thật sự gác cổng.
      # Rẻ và tất định: chỉ đọc file trong repo, không cần môi trường ngoài.
      - name: Thư viện + tài liệu khớp repo (library:drift — số liệu, link bài, cú pháp mã trong bài giảng)
        run: npm run library:drift

      # Khối "Bộ kit của bạn đang ở đâu" là lớp DẪN XUẤT của docs/COURSE.md. Nó nhắc số bài, số cấp
      # độ và tên bài kế tiếp — toàn thứ đã đổi ba lần trong một tuần. Không có phép kiểm này thì nó
      # trôi khỏi giáo trình mà không ai biết.
      - name: Chỉ báo độ chín từng bài khớp giáo trình (course:maturity:check)
        run: npm run course:maturity:check

      # CHẠY sản phẩm thực hành rồi so con số. Ví dụ trụ cột ở Bài 1 từng lệch app ở năm chỗ và
      # không phép kiểm nào bắt, vì mọi phép kiểm cũ đọc văn bản.
      - name: Con số bài giảng khớp app thực hành (course:numbers)
        run: npm run course:numbers

      - name: Mục lục RULE_GLOBAL khớp nội dung (bảng tra sai = agent đọc sai khối luật)
        run: npm run rule -- --check

      - name: Secret scan (F7 — chặn nếu có secret commit trên file đã track)
        run: npm run secret:scan

      - name: npm audit (F7 — report advisory + CHẶN ở high/critical; đã vá 2 high, còn moderate uuid/exceljs)
        run: |
          # `npm audit` trần đã BỎ (04/09/2026): đo 74s, trùng dữ liệu với `audit:ci` (71s) ngay dưới.
          npm run audit:ci

      - name: Lint + typecheck (F7 — ENFORCED; baseline 0 error, CHẶN khi có lỗi mới)
        run: |
          npm run lint
          npm run typecheck

      - name: Safe dry-runs (không secret / không UAT)
        run: |
          set -e
          # Dashboard render trạng thái rỗng (knowledge/ live rỗng) — phải exit 0, không crash.
          npm run dashboard
          # Risk register cold-start (band từ Impact trong risk_model) — phải exit 0.
          npm run risk

      - name: Security guard phải TỪ CHỐI khi thiếu --confirm-nonprod
        run: |
          # security_check là never-auto: chạy không có --confirm-nonprod phải exit != 0 (không nã UAT).
          if node scripts/qa/security_check.js --catalog tests/fixtures/minimal_ui_catalog.json; then
            echo "LỖI: security_check KHÔNG được chạy khi thiếu --confirm-nonprod"; exit 1
          else
            echo "OK: security guard từ chối đúng"
          fi
